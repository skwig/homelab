services:
  registry:
    image: registry:2.8.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      kind:
        aliases:
          - dev-registry

  nfs:
    image: itsthenetwork/nfs-server-alpine:12
    restart: unless-stopped
    privileged: true
    environment:
      SHARED_DIRECTORY: /exports
    volumes:
      - nfs-data:/exports
    networks:
      kind:
        aliases:
          - dev-nfs

  smb:
    image: dperson/samba:amd64
    restart: unless-stopped
    command:
      - -u
      - dev;dev
      - -s
      - share;/share;yes;no;no;dev
      - -p
    volumes:
      - smb-data:/share
    networks:
      kind:
        aliases:
          - dev-smb

  s3:
    image: ghcr.io/versity/versitygw:v1.8.0
    restart: unless-stopped
    environment:
      ROOT_ACCESS_KEY: dev
      ROOT_SECRET_KEY: dev-password
      VGW_PORT: ":7070"
      VGW_ADMIN_PORT: ":7071"
      VGW_REGION: us-east-1
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data/s3
      VGW_IAM_DIR: /data/iam
    volumes:
      - s3-data:/data/s3
      - s3-iam:/data/iam
    networks:
      kind:
        aliases:
          - dev-s3

volumes:
  registry-data:
  nfs-data:
  smb-data:
  s3-data:
  s3-iam:

networks:
  kind:
    external: true
    name: kind
