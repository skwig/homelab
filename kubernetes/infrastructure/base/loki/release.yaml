---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-loki
spec:
  interval: 6h
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  releaseName: loki
  targetNamespace: monitoring
  interval: 10m
  chart:
    spec:
      chart: loki
      version: 18.16.2
      sourceRef:
        kind: HelmRepository
        name: grafana-loki
  install:
    createNamespace: true
  # https://github.com/grafana-community/helm-charts/blob/main/charts/loki/values.yaml
  values:
    loki:
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2025-08-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      auth_enabled: false
    deploymentMode: Monolithic
    gateway:
      # Required anti-affinity prevents two gateway pods sharing our only node.
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        enableStatefulSetAutoDeletePVC: false
        size: 10Gi
        storageClass: nfs-share-retain
      resources:
        limits:
          memory: 500Mi
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
