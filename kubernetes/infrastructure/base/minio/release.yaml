---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: operator-minio
spec:
  interval: 6h
  url: https://operator.min.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
spec:
  releaseName: minio
  targetNamespace: minio
  interval: 10m
  chart:
    spec:
      chart: operator
      version: 7.1.1
      sourceRef:
        kind: HelmRepository
        name: operator-minio
  install:
    createNamespace: true
