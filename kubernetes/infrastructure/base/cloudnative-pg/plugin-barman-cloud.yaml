---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: barman-cloud
spec:
  interval: 10m
  url: https://github.com/cloudnative-pg/plugin-barman-cloud
  ref:
    tag: v0.9.0
  ignore: |
    /*
    !/manifest.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barman-cloud
spec:
  targetNamespace: cloudnative-pg
  interval: 10m
  path: .
  prune: true
  sourceRef:
    kind: GitRepository
    name: barman-cloud
  retryInterval: 1m
