---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
spec:
  interval: 6h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
spec:
  releaseName: ingress-nginx
  targetNamespace: ingress-nginx
  interval: 10m
  chart:
    spec:
      chart: ingress-nginx
      version: 4.15.1
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
  install:
    createNamespace: true
  # https://github.com/kubernetes/ingress-nginx/tree/main/charts/ingress-nginx#values
  values:
    controller:
      # Makes apps able to create ingresses without the ingress controller already running, 
      # mimicking behavior of different ingress controllers.
      # Not ideal in nginx, but it's getting replaced soon anyway
      admissionWebhooks:
        failurePolicy: Ignore
        timeoutSeconds: 2
      ingressClassResource:
        enabled: true
        name: nginx
        default: true
      kind: Deployment
      hostNetwork: true
      service:
        type: ClusterIP
      metrics:
        enabled: true
