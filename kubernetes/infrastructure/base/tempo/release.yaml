---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-tempo
spec:
  interval: 6h
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  releaseName: tempo
  targetNamespace: monitoring
  interval: 10m
  chart:
    spec:
      chart: tempo
      version: 3.2.1
      sourceRef:
        kind: HelmRepository
        name: grafana-tempo
  install:
    createNamespace: true
  # https://github.com/grafana-community/helm-charts/blob/main/charts/tempo/values.yaml
  values:
    persistence:
      enabled: true
      storageClassName: nfs-share-retain
      accessModes:
        - ReadWriteOnce
      size: 10Gi
