---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
spec:
  interval: 6h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.10.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  dependsOn:
    - name: loki
    - name: tempo
  install:
    createNamespace: true
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    prometheus:
      enabled: true
      prometheusSpec:
        enableOTLPReceiver: true
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-share-retain
              accessModes: ["ReadWriteMany"]
              resources:
                requests:
                  storage: 10Gi
    alertManager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-share-retain
              accessModes: ["ReadWriteMany"]
              resources:
                requests:
                  storage: 1Gi
    grafana:
      enabled: true
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer-production
          external-dns.kubernetes.io/hostname: grafana.homelab.skwig.party
          external-dns.kubernetes.io/target: 192.168.100.47
        tls:
          - secretName: grafana-homelab-tls
            hosts:
              - grafana.homelab.skwig.party
        hosts:
          - grafana.homelab.skwig.party
        paths:
          - /
      additionalDataSources:
        # https://grafana.com/docs/grafana/latest/datasources/loki/#provision-the-loki-data-source
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki.monitoring:3100
          isDefault: false
          jsonData:
            derivedFields:
              - name: "trace_id"
                matcherType: "label"
                matcherRegex: "trace_id"
                url: "$${__value.raw}"
                datasourceUid: "tempo"
                urlDisplayLabel: "Trace: $${__value.raw}"
        # https://grafana.com/docs/grafana/latest/datasources/tempo/configure-tempo-data-source/#provision-the-data-source
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo.monitoring:3200
          isDefault: false
          jsonData:
            tracesToLogsV2:
              customQuery: true
              datasourceUid: "loki"
              query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
              tags:
                - key: "service.name"
                  value: "service_name"
            lokiSearch:
              datasourceUid: loki
            tracesToMetrics:
              datasourceUid: prometheus
              spanStartTimeShift: "-2m"
              spanEndTimeShift: "2m"
              tags:
                - key: service.name
                  value: job
              queries:
                - name: GC pause time (ms over 2m)
                  query: 'increase(dotnet_gc_pause_time_seconds_total{$${__tags}}[2m]) * 1000'
                - name: GC collections (over 2m)
                  query: 'sum by (gc_heap_generation) (increase(dotnet_gc_collections_total{$${__tags}}[2m]))'
                - name: Allocation rate (bytes/s)
                  query: 'rate(dotnet_gc_heap_allocated_bytes_total{$${__tags}}[2m])'
            serviceMap:
              datasourceUid: prometheus
