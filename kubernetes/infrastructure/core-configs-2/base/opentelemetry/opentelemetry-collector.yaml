---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry-collector
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors: {}
    exporters:
      otlphttp/tempo:
        endpoint: http://tempo.monitoring:4318
        tls:
          insecure: true
      otlphttp/prometheus:
        endpoint: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/otlp
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki.monitoring:3100/otlp
        tls:
          insecure: true
      debug: {}
    extensions:
      health_check:
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679
    service:
      extensions:
        - health_check
        - pprof
        - zpages
      pipelines:
        traces:
          receivers: [otlp]
          processors: []
          exporters: [debug, otlphttp/tempo]
        metrics:
          receivers: [otlp]
          processors: []
          exporters: [debug, otlphttp/prometheus]
        logs:
          receivers: [otlp]
          processors: []
          exporters: [debug, otlphttp/loki]
