---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
spec:
  interval: 10m
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  releaseName: external-secrets
  targetNamespace: external-secrets
  interval: 10m
  chart:
    spec:
      chart: external-secrets
      # upgrading to 0.17.0 and above causes flux to fail healthchecks due to missing resources,
      # even though they get created and are ready
      version: 0.16.2
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  install:
    createNamespace: true
