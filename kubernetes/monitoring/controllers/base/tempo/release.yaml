---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-tempo
spec:
  interval: 10m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  releaseName: tempo
  targetNamespace: monitoring
  interval: 10m
  chart:
    spec:
      chart: tempo
      version: 1.23.3
      sourceRef:
        kind: HelmRepository
        name: grafana-tempo
  install:
    createNamespace: true
  # https://artifacthub.io/packages/helm/grafana/tempo?modal=values
  values:
    persistence:
      enabled: true
      storageClassName: nfs-share-retain
      accessModes:
        - ReadWriteOnce
      size: 10Gi
