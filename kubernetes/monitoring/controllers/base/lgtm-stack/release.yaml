---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
spec:
  interval: 10m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lgtm-stack
spec:
  releaseName: lgtm-stack
  targetNamespace: monitoring
  interval: 10m
  chart:
    spec:
      chart: lgtm-distributed
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    createNamespace: true
  # https://artifacthub.io/packages/helm/grafana/lgtm-distributed?modal=values
  values:
    grafana-oncall:
      enabled: false
    grafana:
      enabled: true
      # ingress:
      #   enabled: true
      #   annotations:
      #     cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer-production
      #     external-dns.alpha.kubernetes.io/hostname: lgtm.homelab.skwig.party
      #     external-dns.alpha.kubernetes.io/target: 192.168.100.47
      #   tls:
      #     - secretName: lgtm-homelab-tls
      #       hosts:
      #         - lgtm.homelab.skwig.party
      #   hosts:
      #     - lgtm.homelab.skwig.party
      #   paths:
      #     - /
    loki:
      enabled: true
    # https://artifacthub.io/packages/helm/grafana/mimir-distributed?modal=values
    mimir:
      enabled: true
      alertmanager:
        persistentVolume:
          storageClass: smb-share-retain
      ingester:
        persistentVolume:
          storageClass: smb-share-retain
      store_gateway:
        persistentVolume:
          storageClass: smb-share-retain
      compactor:
        persistentVolume:
          storageClass: smb-share-retain
      # https://github.com/minio/minio/blob/master/helm/minio/values.yaml
      minio:
        persistence:
          storageClass: smb-share-retain
    tempo:
      enabled: true
