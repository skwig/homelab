---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
spec:
  interval: 10m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lgtm-stack
spec:
  releaseName: lgtm-stack
  targetNamespace: monitoring
  interval: 10m
  chart:
    spec:
      chart: lgtm-distributed
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    createNamespace: true
  # https://artifacthub.io/packages/helm/grafana/lgtm-distributed?modal=values
  values:
    grafana-oncall:
      enabled: false
    grafana:
      enabled: true
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer-production
          external-dns.alpha.kubernetes.io/hostname: lgtm.homelab.skwig.party
          external-dns.alpha.kubernetes.io/target: 192.168.100.47
        tls:
          - secretName: lgtm-homelab-tls
            hosts:
              - lgtm.homelab.skwig.party
        hosts:
          - lgtm.homelab.skwig.party
    # https://artifacthub.io/packages/helm/grafana/loki-distributed?modal=values
    loki:
      enabled: true
    # https://artifacthub.io/packages/helm/grafana/mimir-distributed?modal=values
    mimir:
      enabled: true
      alertmanager:
        persistentVolume:
          storageClass: local-path-retain
      ingester:
        persistentVolume:
          storageClass: local-path-retain
      store_gateway:
        persistentVolume:
          storageClass: local-path-retain
      compactor:
        persistentVolume:
          storageClass: local-path-retain
      # https://github.com/minio/minio/blob/master/helm/minio/values.yaml
      minio:
        enabled: true
        persistence:
          storageClass: local-path-retain

    # https://artifacthub.io/packages/helm/grafana/tempo-distributed?modal=values
    tempo:
      enabled: true
      traces:
        otlp:
          http:
            enabled: true
          grpc:
            enabled: true
