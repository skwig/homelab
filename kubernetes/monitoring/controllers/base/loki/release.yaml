---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-loki
spec:
  interval: 10m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  releaseName: loki
  targetNamespace: monitoring
  interval: 10m
  chart:
    spec:
      chart: loki
      version: 6.35.1
      sourceRef:
        kind: HelmRepository
        name: grafana-loki
  install:
    createNamespace: true
  # https://artifacthub.io/packages/helm/grafana/loki?modal=values
  values:
    loki:
      storage:
        type: filesystem
        filesystem:
          admin_api_directory: null
      schemaConfig:
        configs:
          - from: "2025-08-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      auth_enabled: false
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 10Gi
        storageClass: nfs-share-retain
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
