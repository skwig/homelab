---
# apiVersion: source.toolkit.fluxcd.io/v1
# kind: HelmRepository
# metadata:
#   name: grafana
# spec:
#   interval: 10m
#   url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lgtm-monolithic-tempo
spec:
  releaseName: lgtm-monolithic-tempo
  targetNamespace: monitoring
  interval: 10m
  chart:
    spec:
      chart: tempo
      version: 1.23.2
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    createNamespace: true
  # https://artifacthub.io/packages/helm/grafana/tempo?modal=values
  values:
    persistence:
      enabled: true
      storageClassName: local-path-retain
      accessModes:
        - ReadWriteOnce
      size: 10Gi
