---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-renovate-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-controllers
    - name: infrastructure-renovate
    - name: infrastructure-external-secrets-configs

  interval: 1h
  retryInterval: 1m
  timeout: 5m

  path: ./kubernetes/infrastructure/configs/base/renovate

  sourceRef:
    kind: GitRepository
    name: flux-system

  prune: false
  deletionPolicy: Orphan
  wait: true
