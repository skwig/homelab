---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-alerts
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-core-configs
    - name: infrastructure-alerts-configs

  interval: 1h
  retryInterval: 1m
  timeout: 5m

  path: ./kubernetes/infrastructure/controllers/base/alerts

  sourceRef:
    kind: GitRepository
    name: flux-system

  prune: false
  deletionPolicy: Orphan
  wait: true
