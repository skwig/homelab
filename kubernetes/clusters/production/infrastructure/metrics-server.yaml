---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-metrics-server
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-core-configs

  interval: 1h
  retryInterval: 1m
  timeout: 5m

  path: ./kubernetes/infrastructure/controllers/base/metrics-server

  sourceRef:
    kind: GitRepository
    name: flux-system

  prune: false
  deletionPolicy: Orphan
  wait: true
