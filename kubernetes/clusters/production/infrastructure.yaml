    - name: infrastructure-core-configs-2
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/infrastructure/controllers/overlays/production
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
