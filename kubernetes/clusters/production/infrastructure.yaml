# `core` being separate forces external-secrets to be created first, which a lot of infrastructure depends on for secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-core-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-core-controllers
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/infrastructure/core-configs/overlays/production
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-core-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/infrastructure/core-controllers/overlays/production
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-core-configs-2
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-core-controllers-2
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/infrastructure/core-configs-2/overlays/production
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-core-controllers-2
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-core-configs
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/infrastructure/core-controllers-2/overlays/production
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-controllers
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/infrastructure/configs/overlays/production
  sourceRef:
    kind: GitRepository
    name: flux-system
