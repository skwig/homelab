---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10s
  url: oci://dev-registry:5000/homelab
  ref:
    tag: dev
  insecure: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10s
  retryInterval: 10s
  timeout: 10m
  path: ./kubernetes/clusters/dev
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
