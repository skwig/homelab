---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-loki
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-monitoring-namespace
    - name: infrastructure-csi-driver-nfs

  interval: 1h
  retryInterval: 1m
  timeout: 5m

  path: ./kubernetes/infrastructure/base/loki

  sourceRef:
    kind: GitRepository
    name: flux-system

  prune: true
  deletionPolicy: Orphan
  wait: true
