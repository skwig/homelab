---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: superuser-credentials-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-cluster-secret-store
    kind: ClusterSecretStore
  data:
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: mailjet-apikey
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: mailjet-secretkey
