---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: "ghcr.io/dani-garcia/vaultwarden:1.34.3"
          imagePullPolicy: Always
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-app
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-app
                  key: port
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-app
                  key: dbname
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-app
                  key: password
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
