---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: n8n
          image: n8nio/n8n:2.45.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
          envFrom:
            - configMapRef:
                name: n8n-configmap
          env:
            - name: N8N_BANK1READONLY_APIKEY
              valueFrom:
                secretKeyRef:
                  name: n8n-bank-credentials
                  key: N8N_BANK1READONLY_APIKEY
            - name: N8N_BANK2READONLY_APIKEY
              valueFrom:
                secretKeyRef:
                  name: n8n-bank-credentials
                  key: N8N_BANK2READONLY_APIKEY
            - name: CREDENTIALS_OVERWRITE_DATA_FILE
              value: /etc/n8n/credentials/overwrites.json
            - name: DB_POSTGRESDB_HOST
              valueFrom:
                secretKeyRef:
                  name: n8n-db-app
                  key: host
            - name: DB_POSTGRESDB_PORT
              valueFrom:
                secretKeyRef:
                  name: n8n-db-app
                  key: port
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: n8n-db-app
                  key: dbname
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-db-app
                  key: username
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-db-app
                  key: password
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-encryption-key
                  key: N8N_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: google-credentials
              mountPath: /etc/n8n/credentials
              readOnly: true
            - name: n8n-data
              mountPath: /home/node/.n8n
      volumes:
        - name: google-credentials
          secret:
            secretName: n8n-google-credentials
            defaultMode: 0440
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-pvc
