apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: signal-api-from-n8n-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: signal-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: n8n
      ports:
        - protocol: TCP
          port: 8080
# Your CNI must enforce NetworkPolicy for this to be a real restriction.
