---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: signal-api
          image: bbernhard/signal-cli-rest-api:0.101
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: native
            - name: AUTO_RECEIVE_SCHEDULE
              value: "0 23 * * *"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: signal-state
              mountPath: /home/.local/share/signal-cli
      volumes:
        - name: signal-state
          persistentVolumeClaim:
            claimName: signal-api-pvc
