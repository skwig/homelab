---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-google-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-cluster-secret-store
  target:
    template:
      engineVersion: v2
      data:
        overwrites.json: |
          {
            "gmailOAuth2": {
              "clientId": {{ .clientId | toJson }},
              "clientSecret": {{ .clientSecret | toJson }}
            }
          }
  data:
    - secretKey: clientId
      remoteRef:
        key: n8n-google-clientid
    - secretKey: clientSecret
      remoteRef:
        key: n8n-google-clientsecret
