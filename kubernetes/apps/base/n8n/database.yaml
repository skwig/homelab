apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-db-credentials
  storage:
    storageClass: local-path-retain
    size: 5Gi
# Single node / single instance: no HA. Add encrypted, tested backups before real data.
