---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-bank-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-cluster-secret-store
  data:
    - secretKey: N8N_BANK1READONLY_APIKEY
      remoteRef:
        key: n8n-bank1readonly-apikey
    - secretKey: N8N_BANK2READONLY_APIKEY
      remoteRef:
        key: n8n-bank2readonly-apikey
