---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: linkding
spec:
  exporter: 
    endpoint: http://opentelemetry-collector-collector.opentelemetry:4318
  propagators:
     - tracecontext
     - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  python:
    env:
      - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
        value: 'true'
