---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: linkding-db
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  bootstrap:
    initdb: {}
  storage:
    size: 1Gi
    storageClass: local-path-retain
  # backup:
  #   barmanObjectStore:
  #     destinationPath: abc
  #     endpointURL: 
  managed:
    services:
      disabledDefaultServices:
        - ro
        - r
  monitoring:
    enablePodMonitor: true
---
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: linkding-backup
spec:
  configuration:
    name: storage-configuration
  users:
    - name: storage-user
  pools:
    - name: pool-0
      servers: 1
      volumesPerServer: 1
      volumeClaimTemplate:
        metadata:
          name: backup
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: nfs-share-retain
  buckets:
    - name: "test-bucket1"
      region: "us-east-1"
      objectLock: true
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-configuration
type: Opaque
stringData:
  config.env: |-
    export MINIO_ROOT_USER="minio"
    export MINIO_ROOT_PASSWORD="minio123"
    export MINIO_STORAGE_CLASS_STANDARD="EC:2"
    export MINIO_BROWSER="on"
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-user
type: Opaque
data:
  CONSOLE_ACCESS_KEY: Y29uc29sZQ==
  CONSOLE_SECRET_KEY: Y29uc29sZTEyMw==
