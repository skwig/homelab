---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: linkding-db
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  bootstrap:
    initdb: {}
  storage:
    size: 1Gi
    storageClass: local-path-retain
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: versity
  managed:
    services:
      disabledDefaultServices:
        - ro
        - r
  monitoring:
    enablePodMonitor: true
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: versity
spec:
  configuration:
    destinationPath: s3://linkding-db-backup
    endpointURL: http://s3.skwig.party:7070
    s3Credentials:
      accessKeyId:
        name: linkding-db-backup-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: linkding-db-backup-credentials
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: bzip2
  retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: linkding-db-backup
spec:
  immediate: true
  schedule: "0 0 3 * * *"
  cluster:
    name: linkding-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkding-db-backup-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-cluster-secret-store
    kind: ClusterSecretStore
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: linkding-db-backup-accesskey
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: linkding-db-backup-secretkey
