---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: linkding
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  bootstrap:
    initdb:
      database: linkding
      owner: linkding
      secret:
        name: db-credentials-secret
  storage:
    size: 1Gi
    storageClass: local-path-retain
  monitoring:
    enablePodMonitor: true

