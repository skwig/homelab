apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
    spec:
      automountServiceAccountToken: false
      containers:
        - name: opencode
          image: nixos/nix:2.35.2
          imagePullPolicy: IfNotPresent
          command:
            - nix
          args:
            - --extra-experimental-features
            - nix-command flakes
            - develop
            - /etc/opencode
            - --no-write-lock-file
            - --command
            - opencode
            - web
            - --hostname
            - 0.0.0.0
            - --port
            - "4096"
          workingDir: /workspace
          env:
            - name: HOME
              value: /workspace
            - name: OPENCODE_SERVER_USERNAME
              value: opencode
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-secret
                  key: OPENCODE_SERVER_PASSWORD
          ports:
            - name: http
              containerPort: 4096
              protocol: TCP
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: runtime
              mountPath: /etc/opencode
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: opencode-workspace
        - name: runtime
          configMap:
            name: opencode-runtime
