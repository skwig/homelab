apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
    spec:
      automountServiceAccountToken: false
      containers:
        - name: opencode
          image: nixos/nix:2.34.8
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              # Nix rejects flake.lock when mounted as a ConfigMap symlink.
              flake_dir=$(mktemp -d)
              cp -L /etc/opencode/flake.nix /etc/opencode/flake.lock "$flake_dir/"
              exec nix --extra-experimental-features 'nix-command flakes' \
                develop "path:$flake_dir" --no-write-lock-file \
                --command opencode serve --hostname 0.0.0.0 --port 4096
          workingDir: /workspace
          env:
            - name: HOME
              value: /workspace
            - name: OPENCODE_SERVER_USERNAME
              value: opencode
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-secret
                  key: OPENCODE_SERVER_PASSWORD
          ports:
            - name: http
              containerPort: 4096
              protocol: TCP
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: runtime
              mountPath: /etc/opencode
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: opencode-workspace
        - name: runtime
          configMap:
            name: opencode-runtime
