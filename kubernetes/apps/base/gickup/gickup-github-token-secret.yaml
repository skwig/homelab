---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gickup-github-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-cluster-secret-store
    kind: ClusterSecretStore
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: gickup-github-token
