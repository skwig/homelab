---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: discord-webhook
  data:
    - secretKey: address
      remoteRef:
        key: discord-osrsprices-channel-webhook
