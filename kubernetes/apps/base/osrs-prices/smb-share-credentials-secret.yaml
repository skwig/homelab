---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smb-share-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-cluster-secret-store
    kind: ClusterSecretStore
  data:
    - secretKey: username
      remoteRef:
        key: runelite-smb-share-username
    - secretKey: password
      remoteRef:
        key: runelite-smb-share-password
