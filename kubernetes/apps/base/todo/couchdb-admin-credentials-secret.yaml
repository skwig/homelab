---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: todo-couchdb-admin-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-cluster-secret-store
    kind: ClusterSecretStore
  data:
    - secretKey: adminUsername
      remoteRef:
        key: todo-couchdb-admin-username
    - secretKey: adminPassword
      remoteRef:
        key: todo-couchdb-admin-password
