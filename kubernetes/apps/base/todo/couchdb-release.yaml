---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: couchdb
spec:
  interval: 6h
  url: https://apache.github.io/couchdb-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: todo-couchdb
spec:
  releaseName: todo-couchdb
  targetNamespace: todo
  interval: 10m
  chart:
    spec:
      chart: couchdb
      version: 4.6.1
      sourceRef:
        kind: HelmRepository
        name: couchdb
        namespace: todo
  install:
    createNamespace: true
  values:
    clusterSize: 1
    extraSecretName: todo-couchdb-admin-credentials
    couchdbConfig:
      couchdb:
        uuid: 22222222-2222-2222-2222-222222222222
      httpd:
        enable_cors: true
        WWW-Authenticate: Basic realm="couchdb"
      cors:
        credentials: true
        origins: http://localhost:5000, null
      chttpd:
        require_valid_user: true
      chttpd_auth:
        require_valid_user: true
        allow_persistent_cookies: true
        timeout: 2592000
    persistentVolume:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      storageClass: nfs-share-retain
