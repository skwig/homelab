---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: todo
spec:
  interval: 15m
  url: https://raw.githubusercontent.com/skwig/CustomTodo/refs/heads/gh-pages/
  secretRef:
    name: github-credentials-secret
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: todo
spec:
  releaseName: todo
  targetNamespace: todo
  interval: 10m
  chart:
    spec:
      chart: skwigtodo
      version: 1.0.0-64bc493
      sourceRef:
        kind: HelmRepository
        name: todo
        namespace: todo
  install:
    createNamespace: true
    remediation:
      retries: 1
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
  values:
    imagePullSecrets:
      - name: ghcr-credentials-secret
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer-production
        external-dns.alpha.kubernetes.io/hostname: todo.skwig.party
        external-dns.alpha.kubernetes.io/target: 192.168.100.47
      hosts:
        - host: todo.skwig.party
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: todo-tls
          hosts:
            - todo.skwig.party
