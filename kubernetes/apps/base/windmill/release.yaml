---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: windmill
spec:
  interval: 6h
  url: https://windmill-labs.github.io/windmill-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: windmill
spec:
  releaseName: windmill
  targetNamespace: windmill
  interval: 10m
  chart:
    spec:
      chart: windmill
      version: 4.0.305
      sourceRef:
        kind: HelmRepository
        name: windmill
        namespace: windmill
  # https://github.com/windmill-labs/windmill-helm-charts/blob/main/charts/windmill/values.yaml
  values:
    postgresql:
      enabled: false
    windmill:
      appReplicas: 1
      extraReplicas: 0
      baseDomain: windmill.skwig.party
      baseProtocol: https
      databaseUrlSecretName: windmill-db-app
      databaseUrlSecretKey: uri
      app:
        volumes:
          - name: google-credentials
            secret:
              secretName: windmill-google-credentials
        volumeMounts:
          - name: google-credentials
            mountPath: /usr/src/app/oauth.json
            subPath: oauth.json
            readOnly: true
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 2Gi
      indexer:
        enabled: false
      workerGroups:
        - name: default
          replicas: 1
          privileged: true
          volumes:
            - name: google-credentials
              secret:
                secretName: windmill-google-credentials
          volumeMounts:
            - name: google-credentials
              mountPath: /usr/src/app/oauth.json
              subPath: oauth.json
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
    serviceAccount:
      automountServiceAccountToken: false
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer-production
        external-dns.kubernetes.io/hostname: windmill.skwig.party
        external-dns.kubernetes.io/target: 192.168.100.47
      tls:
        - hosts:
            - windmill.skwig.party
          secretName: windmill-skwig-party-tls
