---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill-google-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-cluster-secret-store
  target:
    template:
      engineVersion: v2
      data:
        oauth.json: |
          {
            "gmail": {
              "id": {{ .clientId | toJson }},
              "secret": {{ .clientSecret | toJson }},
              "connect_config": {
                "auth_url": "https://accounts.google.com/o/oauth2/v2/auth",
                "token_url": "https://oauth2.googleapis.com/token",
                "scopes": ["https://www.googleapis.com/auth/gmail.readonly"],
                "extra_params": {
                  "access_type": "offline",
                  "prompt": "consent"
                }
              }
            }
          }
  data:
    - secretKey: clientId
      remoteRef:
        key: n8n-google-clientid
    - secretKey: clientSecret
      remoteRef:
        key: n8n-google-clientsecret
