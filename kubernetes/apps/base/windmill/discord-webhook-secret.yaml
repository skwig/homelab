---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill-discord-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-cluster-secret-store
  data:
    - secretKey: webhook
      remoteRef:
        key: discord-windmill-channel-webhook
