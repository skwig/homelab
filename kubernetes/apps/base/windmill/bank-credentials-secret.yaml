---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill-bank-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-cluster-secret-store
  data:
    - secretKey: bank1
      remoteRef:
        key: n8n-bank1readonly-apikey
    - secretKey: bank2
      remoteRef:
        key: n8n-bank2readonly-apikey
