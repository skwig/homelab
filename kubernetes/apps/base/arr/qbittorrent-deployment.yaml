---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: seed-config
          image: lscr.io/linuxserver/qbittorrent:5.2.3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /config/qBittorrent
              if [ ! -s /config/qBittorrent/qBittorrent.conf ]; then
                # Replace an empty, potentially root-owned old mountpoint atomically.
                temp_file=$(mktemp /config/qBittorrent/.qBittorrent.conf.XXXXXX)
                trap 'rm -f "$temp_file"' EXIT
                cp /defaults/qBittorrent.conf "$temp_file"
                mv "$temp_file" /config/qBittorrent/qBittorrent.conf
              fi
          volumeMounts:
            - mountPath: /config
              name: qbittorrent-config-storage
            - mountPath: /defaults
              name: qbittorrent-config
              readOnly: true
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.3
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: bittorrent-tcp
              containerPort: 6881
              protocol: TCP
            - name: bittorrent-udp
              containerPort: 6881
              protocol: UDP
          volumeMounts:
            - mountPath: /config
              name: qbittorrent-config-storage
            - mountPath: /downloads
              name: qbittorrent-downloads
      volumes:
        - name: qbittorrent-config-storage
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: qbittorrent-config
          configMap:
            name: qbittorrent-config
        - name: qbittorrent-downloads
          persistentVolumeClaim:
            claimName: qbittorrent-downloads
