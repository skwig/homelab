---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-auth-key-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-cluster-secret-store
    kind: ClusterSecretStore
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: tailscale-auth-key
