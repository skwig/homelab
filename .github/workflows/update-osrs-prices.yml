name: Update OSRS Prices Helm Chart

on:
  repository_dispatch:
    types: [update-helm-chart]

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
      
      - name: Update Helm chart version
        run: |
          CHART_VERSION="${{ github.event.client_payload.chart_version }}"
          
          if [ -z "$CHART_VERSION" ]; then
            echo "Error: chart_version not provided in payload"
            exit 1
          fi
          
          echo "Updating chart version to: $CHART_VERSION"
          
          sed -i "s/version: .*/version: $CHART_VERSION/" kubernetes/apps/base/osrs-prices/release.yaml
          
          # Verify the change was made
          grep "version: $CHART_VERSION" kubernetes/apps/base/osrs-prices/release.yaml
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(osrs-prices): update helm chart to version ${{ github.event.client_payload.chart_version }}"
          branch: update-osrs-prices-${{ github.event.client_payload.chart_version }}
          delete-branch: true
          title: "chore(osrs-prices): update helm chart to version ${{ github.event.client_payload.chart_version }}"
          body: |
            Automated update of OSRS Prices Helm chart version.
            
            **Chart Version:** ${{ github.event.client_payload.chart_version }}
            
            This PR was automatically created by the `update-osrs-prices` workflow in response to a repository dispatch event.
          labels: |
            automated
            osrs-prices
